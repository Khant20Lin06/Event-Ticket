<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" width="100%" height="100%" style="background:#0B1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowCyan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.4"/>
    </filter>
    <filter id="glowRed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#EC4899"/>
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="25" width="1480" height="65" rx="12" fill="url(#headerGrad)" stroke="#6366F1" stroke-width="2"/>
    <text x="800" y="52" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="1">AURA — ENTERPRISE HIGH-CONCURRENCY EVENT TICKETING PLATFORM</text>
    <text x="800" y="74" text-anchor="middle" fill="#94A3B8" font-size="12.5" font-family="monospace">System Architecture &amp; Distributed Atomic Concurrency Flow (1,000,000+ Concurrent Requests / 0 Over-Selling Guarantee)</text>
  </g>

  <!-- ==================== TIER 1: CLIENT PRESENTATION ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="1480" height="130" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="60" y="110" width="1480" height="28" rx="10" fill="#1E293B"/>
    <text x="80" y="129" fill="#38BDF8" font-size="13" font-weight="700" font-family="monospace">1. PRESENTATION &amp; CLIENT TIER (ANGULAR 19 SPA)</text>

    <!-- User Client -->
    <rect x="90" y="148" width="420" height="78" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="110" y="172" fill="#38BDF8" font-size="14" font-weight="700">🎬 User Customer Web Portal</text>
    <text x="110" y="193" fill="#CBD5E1" font-size="11.5">• Interactive SVG Seat Matrix (50 - 300 Seats)</text>
    <text x="110" y="210" fill="#CBD5E1" font-size="11.5">• Real-Time 5-Min Countdown Timer &amp; Instant Checkout</text>

    <!-- Operator Console -->
    <rect x="580" y="148" width="440" height="78" rx="8" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5"/>
    <text x="600" y="172" fill="#818CF8" font-size="14" font-weight="700">🛡️ Operator &amp; Executive Console</text>
    <text x="600" y="193" fill="#CBD5E1" font-size="11.5">• Cluster Flow Governor (20 - 1,200 req/sec throttling)</text>
    <text x="600" y="210" fill="#CBD5E1" font-size="11.5">• Live Matrix Controller &amp; Redis Hot-Path Inventory Sync</text>

    <!-- Stress Runners -->
    <rect x="1090" y="148" width="420" height="78" rx="8" fill="url(#cardGrad)" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="1110" y="172" fill="#F43F5E" font-size="14" font-weight="700">⚡ Stress Test Runners (Autocannon / k6)</text>
    <text x="1110" y="193" fill="#CBD5E1" font-size="11.5">• 1,000,000 Concurrent Requests on Single Seat</text>
    <text x="1110" y="210" fill="#CBD5E1" font-size="11.5">• 1 Success (200 OK) + 999,999 Conflicts (409 Rejections)</text>
  </g>

  <!-- ==================== TIER 2: EDGE / NGINX ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="270" width="1480" height="105" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="60" y="270" width="1480" height="28" rx="10" fill="#1E293B"/>
    <text x="80" y="289" fill="#10B981" font-size="13" font-weight="700" font-family="monospace">2. EDGE GATEWAY &amp; LOAD BALANCING (NGINX REVERSE PROXY)</text>

    <rect x="250" y="308" width="1100" height="55" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2"/>
    <text x="800" y="330" text-anchor="middle" fill="#10B981" font-size="14" font-weight="700">🌐 Nginx Dynamic Reverse Proxy &amp; Load Balancer (Port 3000 / SSL)</text>
    <text x="800" y="348" text-anchor="middle" fill="#94A3B8" font-size="11.5">Dynamic DNS Re-Resolver (127.0.0.11) • Round-Robin Cluster Distribution • OWASP Helmet • Ingress Rate Limiting (60 req/min/IP)</text>
  </g>

  <!-- ==================== TIER 3: NESTJS APP CLUSTER ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="405" width="1480" height="155" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="60" y="405" width="1480" height="28" rx="10" fill="#1E293B"/>
    <text x="80" y="424" fill="#818CF8" font-size="13" font-weight="700" font-family="monospace">3. APPLICATION MICROSERVICES CLUSTER (HORIZONTALLY SCALED NESTJS PODS / HPA)</text>

    <!-- Node 1 -->
    <rect x="90" y="445" width="420" height="100" rx="8" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5"/>
    <text x="110" y="470" fill="#A5B4FC" font-size="13.5" font-weight="700">⚙️ NestJS API Pod 1</text>
    <text x="110" y="492" fill="#CBD5E1" font-size="11">• Auth Module (JWT / Role Guard / Passport)</text>
    <text x="110" y="510" fill="#CBD5E1" font-size="11">• Seat Booking &amp; Hold Controller</text>
    <text x="110" y="528" fill="#CBD5E1" font-size="11">• WebSocket Gateway (/seats real-time sync)</text>

    <!-- Node 2 -->
    <rect x="580" y="445" width="440" height="100" rx="8" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5"/>
    <text x="600" y="470" fill="#A5B4FC" font-size="13.5" font-weight="700">⚙️ NestJS API Pod 2</text>
    <text x="600" y="492" fill="#CBD5E1" font-size="11">• Virtual Queue Room Governor Controller</text>
    <text x="600" y="510" fill="#CBD5E1" font-size="11">• Redis Distributed Locking Engine</text>
    <text x="600" y="528" fill="#CBD5E1" font-size="11">• AI Campaign Synopsis &amp; Tag Generator</text>

    <!-- Node N -->
    <rect x="1090" y="445" width="420" height="100" rx="8" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5"/>
    <text x="1110" y="470" fill="#A5B4FC" font-size="13.5" font-weight="700">⚙️ NestJS API Pod N (Auto-Scaled)</text>
    <text x="1110" y="492" fill="#CBD5E1" font-size="11">• Kubernetes HPA (Scales 50 - 500 Pods on CPU/RAM)</text>
    <text x="1110" y="510" fill="#CBD5E1" font-size="11">• BullMQ Queue Job Producers</text>
    <text x="1110" y="528" fill="#CBD5E1" font-size="11">• Liveness &amp; Readiness Health Probes</text>
  </g>

  <!-- ==================== TIER 4: REDIS & BULLMQ ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="590" width="1480" height="150" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="60" y="590" width="1480" height="28" rx="10" fill="#1E293B"/>
    <text x="80" y="609" fill="#F87171" font-size="13" font-weight="700" font-family="monospace">4. IN-MEMORY CONCURRENCY &amp; ASYNCHRONOUS ENGINE (REDIS HOT-PATH &amp; BULLMQ)</text>

    <!-- Redis Lock -->
    <rect x="90" y="630" width="430" height="95" rx="8" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="2" filter="url(#glowRed)"/>
    <text x="110" y="655" fill="#EF4444" font-size="13.5" font-weight="700">🔒 Redis Distributed Atomic Lock</text>
    <text x="110" y="675" fill="#FCA5A5" font-size="11.5" font-family="monospace">SET seat:lock:{id} {userId} NX PX 300000</text>
    <text x="110" y="694" fill="#CBD5E1" font-size="11">• Sub-millisecond atomic mutex lock</text>
    <text x="110" y="711" fill="#CBD5E1" font-size="11">• 409 Conflict rejection for all other contestants</text>

    <!-- Redis Pub/Sub -->
    <rect x="580" y="630" width="440" height="95" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="600" y="655" fill="#F59E0B" font-size="13.5" font-weight="700">📡 Redis Pub/Sub Real-Time Bus</text>
    <text x="600" y="675" fill="#FDE68A" font-size="11.5" font-family="monospace">Channel: 'SEAT_STATUS_UPDATED'</text>
    <text x="600" y="694" fill="#CBD5E1" font-size="11">• Broadcasts seat held / booked state cross-pod</text>
    <text x="600" y="711" fill="#CBD5E1" font-size="11">• Sub-5ms UI update for all active connected fans</text>

    <!-- BullMQ -->
    <rect x="1090" y="630" width="420" height="95" rx="8" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.5"/>
    <text x="1110" y="655" fill="#EC4899" font-size="13.5" font-weight="700">⏱️ BullMQ Background Queues</text>
    <text x="1110" y="677" fill="#CBD5E1" font-size="11">• <b style="fill:#F472B6;">SeatExpirationProcessor:</b> Auto-releases seat after 5m</text>
    <text x="1110" y="697" fill="#CBD5E1" font-size="11">• <b style="fill:#F472B6;">AsyncDbWriteProcessor:</b> Buffers DB transactions</text>
    <text x="1110" y="714" fill="#CBD5E1" font-size="11">• Survives server restarts with Redis persistence</text>
  </g>

  <!-- ==================== TIER 5: PERSISTENCE & PGBOUNCER ==================== -->
  <g filter="url(#shadow)">
    <rect x="60" y="770" width="1480" height="145" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="60" y="770" width="1480" height="28" rx="10" fill="#1E293B"/>
    <text x="80" y="789" fill="#22D3EE" font-size="13" font-weight="700" font-family="monospace">5. PERSISTENCE &amp; CONNECTION POOLING TIER (POSTGRESQL &amp; PGBOUNCER)</text>

    <!-- PgBouncer -->
    <rect x="180" y="810" width="560" height="90" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="2" filter="url(#glowCyan)"/>
    <text x="200" y="835" fill="#22D3EE" font-size="14" font-weight="700">🛡️ PgBouncer Connection Pooler (Port 6432)</text>
    <text x="200" y="857" fill="#CBD5E1" font-size="11.5">• Pool Mode: <b style="fill:#67E8F9;">Transaction Pooling</b> (DEFAULT_POOL_SIZE = 100)</text>
    <text x="200" y="874" fill="#CBD5E1" font-size="11.5">• Multiplexes hundreds of API pod connections down to stable DB pool</text>
    <text x="200" y="891" fill="#CBD5E1" font-size="11.5">• Prevents Postgres connection exhaustion under extreme traffic surges</text>

    <!-- PostgreSQL -->
    <rect x="860" y="810" width="560" height="90" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="880" y="835" fill="#38BDF8" font-size="14" font-weight="700">🗄️ PostgreSQL Relational Database (Port 5433)</text>
    <text x="880" y="857" fill="#CBD5E1" font-size="11.5">• Relational Tables: <b style="fill:#93C5FD;">Users, Events, Seats, Bookings</b></text>
    <text x="880" y="874" fill="#CBD5E1" font-size="11.5">• ACID Transactions with Row-Level Lock (<b style="fill:#93C5FD;">SELECT FOR UPDATE</b> fallback)</text>
    <text x="880" y="891" fill="#CBD5E1" font-size="11.5">• Persistent disk storage with automated seeds on bootstrap</text>
  </g>

  <!-- ==================== FLOW ARROWS ==================== -->
  <!-- Client to Nginx -->
  <line x1="300" y1="226" x2="450" y2="308" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="350" y="260" fill="#38BDF8" font-size="11" font-weight="700">HTTPS / WSS</text>

  <line x1="800" y1="226" x2="800" y2="308" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="1300" y1="226" x2="1150" y2="308" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Nginx to API Nodes -->
  <line x1="600" y1="363" x2="300" y2="445" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="800" y1="363" x2="800" y2="445" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1000" y1="363" x2="1300" y2="445" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="815" y="390" fill="#10B981" font-size="11" font-weight="700">Round-Robin API Replicas</text>

  <!-- API to Redis Lock -->
  <line x1="300" y1="545" x2="300" y2="630" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="180" y="580" fill="#EF4444" font-size="11" font-weight="700">1. Atomic SET NX PX Lock</text>

  <!-- API to Redis Pub/Sub -->
  <line x1="800" y1="545" x2="800" y2="630" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="815" y="580" fill="#F59E0B" font-size="11" font-weight="700">2. Broadcast Seat Status Change</text>

  <!-- API to BullMQ -->
  <line x1="1300" y1="545" x2="1300" y2="630" stroke="#EC4899" stroke-width="2" marker-end="url(#arrowPink)"/>
  <text x="1130" y="580" fill="#EC4899" font-size="11" font-weight="700">3. Enqueue 5-min Release Job</text>

  <!-- PgBouncer Connection -->
  <line x1="500" y1="545" x2="460" y2="810" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="495" y="760" fill="#06B6D4" font-size="11" font-weight="700">4. Multiplexed DB Pool</text>

  <!-- PgBouncer to PostgreSQL -->
  <line x1="740" y1="855" x2="860" y2="855" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <text x="755" y="845" fill="#38BDF8" font-size="11" font-weight="700">5. ACID Commit</text>

  <!-- BullMQ Async DB Write -->
  <path d="M 1200 725 L 1200 760 L 650 760 L 650 810" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowPink)"/>
  <text x="850" y="755" fill="#EC4899" font-size="10.5">Async Batch DB Writes</text>

  <!-- FOOTER BADGE -->
  <text x="800" y="960" text-anchor="middle" fill="#64748B" font-size="11" font-family="monospace">
    ARCHITECTURE DESIGNED FOR HIGH-CONCURRENCY CONFLICT-FREE EVENT TICKETING • NESTJS + REDIS + PGBOUNCER + POSTGRESQL + ANGULAR 19
  </text>
</svg>
