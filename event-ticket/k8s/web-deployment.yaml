apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-ticket-web
  labels:
    app: event-ticket-web
    tier: frontend
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: event-ticket-web
  template:
    metadata:
      labels:
        app: event-ticket-web
        tier: frontend
    spec:
      containers:
      - name: event-ticket-web
        image: enterprise-registry.io/event-ticket-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http-web
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
