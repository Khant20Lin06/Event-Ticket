apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-ticket-api
  labels:
    app: event-ticket-api
    tier: backend
spec:
  # Base replicas; HPA scales this up to 500 based on CPU/Memory load
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: event-ticket-api
  template:
    metadata:
      labels:
        app: event-ticket-api
        tier: backend
    spec:
      containers:
      - name: event-ticket-api
        image: enterprise-registry.io/event-ticket-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http-api
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: "pgbouncer-service"
        - name: DB_PORT
          value: "5432"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
